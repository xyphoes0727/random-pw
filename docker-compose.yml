networks:
  pkiit_net:

volumes:
  # mysql_data:
  neo4j_data:
  neo4j_logs:
  delta_lake_data:
  models_data:
  rabbitmq_data:
  pathway_persistence_data:
  zookeeper_data:     
  zookeeper_log:       
  kafka_data:
  redis_data:

services:
  dense-index:
    image: ghcr.io/pinecone-io/pinecone-index:latest
    container_name: dense-index
    networks: [pkiit_net]
    environment:      
      PORT: 5081
      INDEX_TYPE: serverless
      VECTOR_TYPE: dense
      DIMENSION: 23
      METRIC: cosine
    ports:
      - "5081:5081"
    platform: linux/amd64
  ngrok:
    image: ngrok/ngrok:latest
    depends_on:
      - ambient-agent
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    ports:
      - "4040:4040"
    networks: 
      - pkiit_net

  rabbitmq:
    image: rabbitmq:4.2-alpine
    container_name: rabbitmq
    networks: [pkiit_net]
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "1883:1883"   
    environment:
      RABBITMQ_DEFAULT_USER: my_user
      RABBITMQ_DEFAULT_PASS: my_password
      RABBITMQ_DEFAULT_VHOST: myvhost
      RABBITMQ_ERLANG_COOKIE: "y9T7tG4mK2pA0cZ6xH8dL3sV1jQ5bNfR"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf 
      - ./enabled_plugins:/etc/rabbitmq/enabled_plugins
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: pkiit_zookeeper
    networks: [pkiit_net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pk_kafka
    networks: [pkiit_net]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9095:9092"
    environment:
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9093 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  create-topics:
    image: confluentinc/cp-kafka:7.6.1
    container_name: pkiit_create_topics
    networks: [pkiit_net]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Waiting for Kafka to be ready...' &&
      sleep 5 &&
      
      echo 'Creating topics...' &&
      
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic ground-truth --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic transactions-raw --partitions 9 --replication-factor 1 &&
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic enriched --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic user_profiles --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic ml_prediction --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server pk_kafka:9093 --create --if-not-exists --topic mcp_confidence --partitions 6 --replication-factor 1 &&

      echo 'All topics created successfully.'
      "

  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j-fraud
    networks: [pkiit_net]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH : neo4j/frauddetection
      NEO4J_PLUGINS : '["graph-data-science"]'
      NEO4J_server_memory_heap_max__size : 8G
      NEO4J_server_memory_pagecache_size : 2G
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p frauddetection 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [pkiit_net]
    ports:
        - "6380:6379"             
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    networks: [pkiit_net]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ["--config=/etc/otel-collector-config.yaml"]


  fraud-ingest-migrations:
    image: aphrodoe/fraud-ingest:latest
    build:
      context: ..
      dockerfile: deploy/fraud_ingest.Dockerfile
    container_name: fraud_ingest_migrations
    networks: [pkiit_net]
    env_file: ./.env
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    command: ["echo", "Migrations completed"]
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh:ro
      - delta_lake_data:/app/delta_lake
    restart: "no"

  fraud-ingest-api:
    image: aphrodoe/fraud-ingest:latest
    build:
      context: ..
      dockerfile: deploy/fraud_ingest.Dockerfile
    container_name: fraud_ingest_api
    networks: [pkiit_net]
    env_file: ./.env
    depends_on:
      fraud-ingest-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - delta_lake_data:/app/delta_lake
    environment:
      DJANGO_SETTINGS_MODULE : fraud_ingest.settings
      OTEL_SERVICE_NAME : fraud-ingest-api
      OTEL_RESOURCE_ATTRIBUTES : service.namespace=pkiit,deployment.environment=development
      OTEL_EXPORTER_OTLP_ENDPOINT : http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL : grpc
      OTEL_TRACES_EXPORTER : otlp
      OTEL_METRICS_EXPORTER : otlp
      OTEL_LOGS_EXPORTER : otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED : "true"
    
    entrypoint: >
      opentelemetry-instrument gunicorn fraud_ingest.asgi:application -k uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000
    restart: unless-stopped

  ambient-agent:
    image: aphrodoe/ambient-agent:latest
    build:
      context: ..
      dockerfile: deploy/ambient.Dockerfile
    container_name: ambient_agent
    networks: [pkiit_net]
    ports:

      - "8124:8124"
    expose:
      - "8124"
    env_file: ./.env
    depends_on:
      fraud-ingest-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped  

  kafka-consumer:
    image: aphrodoe/kafka-consumer:latest
    build:
      context: ..
      dockerfile: deploy/kafka_consumer.Dockerfile
    container_name: kafka_consumer
    networks: [pkiit_net]
    env_file: ./.env
    environment:
      OTEL_SERVICE_NAME: kafka-consumer
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=pkiit,deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
    entrypoint : >
      python manage.py run_kafka_consumer
    depends_on:
      fraud-ingest-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - delta_lake_data:/app/delta_lake
    restart: unless-stopped  

  kafka-consumer-bigquery:
    image: aphrodoe/kafka-consumer-bigquery:latest
    build:
      context: ..
      dockerfile: deploy/kafka_consumer_bigquery.Dockerfile
    container_name: kafka_consumer_bigquery
    networks: [pkiit_net]
    env_file: ./.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/key.json
    depends_on:
      fraud-ingest-migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    volumes:
      - delta_lake_data:/app/delta_lake
      - ./absolute-disk-479813-c7-6a4a21bc12da.json:/etc/gcp/key.json:ro
    restart: unless-stopped  

    command: ["python", "fraud_ingest/manage.py", "run_bigquery_consumer"]

  pathway-1:
    image: aphrodoe/pathway-processor:latest
    build:
      context: ..
      dockerfile: deploy/pathway.Dockerfile
    container_name: pathway_1
    networks: [pkiit_net]
    env_file: ./.env
    user: root
    environment:
      - INSTANCE_ID=0
      - NUM_INSTANCES=3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      otel-collector:
        condition: service_started
      create-topics:
        condition: service_completed_successfully
    volumes:
      - delta_lake_data:/app/delta_lake
      - pathway_persistence_data:/app/persistence
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pathway-2:
    image: aphrodoe/pathway-processor:latest
    build:
      context: ..
      dockerfile: deploy/pathway.Dockerfile
    container_name: pathway_2
    networks: [pkiit_net] 
    env_file: ./.env
    user: root
    environment:
      - INSTANCE_ID=1
      - NUM_INSTANCES=3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      otel-collector:
        condition: service_started
      create-topics:
        condition: service_completed_successfully
    volumes:
      - delta_lake_data:/app/delta_lake
      - pathway_persistence_data:/app/persistence
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pathway-3:
    image: aphrodoe/pathway-processor:latest
    build:
      context: ..
      dockerfile: deploy/pathway.Dockerfile
    container_name: pathway_3
    networks: [pkiit_net]
    env_file: ./.env
    user: root
    environment:
      - INSTANCE_ID=2
      - NUM_INSTANCES=3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      otel-collector:
        condition: service_started
      create-topics:
        condition: service_completed_successfully
    volumes:
      - delta_lake_data:/app/delta_lake
      - pathway_persistence_data:/app/persistence
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ml-engine:
    image: aphrodoe/ml-engine:latest
    build:
      context: ..
      dockerfile: deploy/ml_engine.Dockerfile
    container_name: ml_engine
    networks: [pkiit_net]
    env_file: ./.env
    environment:
      DJANGO_SETTINGS_MODULE: 
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
      MALLOC_CONF: background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000
      OTEL_SERVICE_NAME: ml-engine
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=pkiit,deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"

    entrypoint: >
      opentelemetry-instrument python -m ml_engine.main

    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    volumes:
      - models_data:/app/models
      - delta_lake_data:/app/delta_lake
    restart: unless-stopped

  neo4j-service:
    image: aphrodoe/neo4j-service:latest
    build:
      context: ..
      dockerfile: deploy/neo4j_service.Dockerfile
    container_name: neo4j_service
    networks: [pkiit_net]
    env_file: ./.env
    environment:
      OTEL_SERVICE_NAME : neo4j
      OTEL_RESOURCE_ATTRIBUTES : service.namespace=pkiit,deployment.environment=development
      OTEL_EXPORTER_OTLP_ENDPOINT : http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL : grpc
      OTEL_TRACES_EXPORTER : otlp
      OTEL_METRICS_EXPORTER : otlp
      OTEL_LOGS_EXPORTER : otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED : "true"
    
    entrypoint: >
      opentelemetry-instrument python -m neo4j_service.main
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - delta_lake_data:/app/delta_lake
    restart: unless-stopped
    
  kafka-producer:
    image: aphrodoe/kafka-producer:latest
    build:
      context: ..
      dockerfile: deploy/kafka_producer.Dockerfile 
    container_name: kafka_producer
    networks: [pkiit_net]

    working_dir: /app
    env_file: ./.env

    depends_on:
      kafka:
        condition: service_healthy
      create-topics:
        condition: service_completed_successfully

    volumes:
      - ./data:/app/data

    entrypoint: ["python", "/app/fraud_ingest/manage.py", "produce_from_csv"]

    profiles: ["producer"]


