  celery-worker:
    image: aphrodoe/fraud-ingest:latest
    container_name: celery-worker
    build:
      context: ..
      dockerfile: deploy/fraud_ingest.Dockerfile
    working_dir: /app
    command: >
      sh -c "export PYTHONPATH=/app &&
            celery -A fraud_ingest.celery worker --loglevel=INFO"
    environment:
      - DJANGO_SETTINGS_MODULE=fraud_ingest.settings
      - PYTHONPATH=/app
    depends_on:
      - rabbitmq
      - fraud-ingest-api
    networks:
      - pkiit_net
  celery-beat:
    image: aphrodoe/fraud-ingest:latest
    container_name: celery-beat
    build:
      context: ..
      dockerfile: deploy/fraud_ingest.Dockerfile
    working_dir: /app
    command: >
      sh -c "export PYTHONPATH=/app &&
            celery -A fraud_ingest.celery beat --loglevel=INFO"
    environment:
      - DJANGO_SETTINGS_MODULE=fraud_ingest.settings
      - PYTHONPATH=/app
    depends_on:
      - rabbitmq
      - fraud-ingest-api
    networks:
      - pkiit_net
